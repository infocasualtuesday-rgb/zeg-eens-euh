<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeg Eens Euh</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101114;
  color: white;
}

button, input {
  font: inherit;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1b1d22;
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 20px;
}

h1 {
  text-align: center;
  font-size: 42px;
  margin: 10px 0 25px;
}

h2 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  border: 2px solid #444;
  background: #101114;
  color: white;
  margin-bottom: 12px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 16px 20px;
  font-weight: bold;
  cursor: pointer;
}

.green {
  background: #21c66b;
  color: #07130c;
}

.yellow {
  background: #ffd447;
  color: #171300;
}

.white {
  background: white;
  color: black;
}

.red {
  background: #ed1c2e;
  color: white;
}

.bigButton {
  width: 100%;
  font-size: 28px;
  padding: 25px;
}

.timer {
  text-align: center;
  font-size: 110px;
  font-weight: 900;
  margin: 20px 0;
}

.topic {
  text-align: center;
  font-size: 34px;
  font-weight: bold;
}

.players {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.player {
  background: #30333b;
  border-radius: 30px;
  padding: 9px 15px;
}

.qr {
  background: white;
  padding: 15px;
  width: max-content;
  margin: 20px auto;
}

.winner {
  background: #46151a;
  border: 3px solid #ed1c2e;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  margin-top: 20px;
}

.winnerName {
  font-size: 55px;
  font-weight: 900;
}

.hidden {
  display: none;
}

.code {
  text-align: center;
  font-size: 50px;
  font-weight: 900;
  letter-spacing: 8px;
}

.small {
  color: #aaa;
  text-align: center;
}

.center {
  text-align: center;
}

.buzz {
  width: 90vw;
  max-width: 500px;
  height: 60vh;
  font-size: 55px;
  font-weight: 900;
  border-radius: 35px;
  background: #ed1c2e;
  color: white;
  box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

.buzz:disabled {
  background: #44474f;
  color: #888;
  box-shadow: none;
}

.playerPage {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.playerBox {
  width: 100%;
  max-width: 600px;
  padding: 20px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyBEtltMP6qcY6lnjTunIhjy4iqchDqlxQ",
  authDomain: "zeg-eens-euh.firebaseapp.com",
  databaseURL: "https://zeg-eens-euh-default-rtdb.firebaseio.com",
  projectId: "zeg-eens-euh",
  storageBucket: "zeg-eens-euh.firebasestorage.app",
  messagingSenderId: "285021172009",
  appId: "1:285021172009:web:2aafbf950b5c6600018738"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =========================
   HULPFUNCTIES
========================= */

function randomCode() {
  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let result = "";

  for (let i = 0; i < 6; i++) {
    result += letters[Math.floor(Math.random() * letters.length)];
  }

  return result;
}

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function escapeHTML(text) {
  return String(text || "").replace(/[&<>"']/g, function(c) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[c];
  });
}


/* =========================
   WELKE MODUS?
========================= */

const mode =
  getParam("player") !== null ? "player" :
  getParam("screen") !== null ? "screen" :
  "host";

const gameCode = getParam("game");


/* =========================
   HOST
========================= */

if (mode === "host") {

  let code = localStorage.getItem("zegEensEuhGame");

  if (!code) {
    code = randomCode();
    localStorage.setItem("zegEensEuhGame", code);
  }

  const gameRef = db.ref("games/" + code);

  gameRef.once("value").then(snapshot => {

    if (!snapshot.exists()) {

      gameRef.set({
        topic: "",
        running: false,
        endAt: 0,
        buzzer: null,
        players: {}
      });

    }

    showHost(code);

  });

}


/* =========================
   HOST SCHERM
========================= */

function showHost(code) {

  document.getElementById("app").innerHTML = `

    <div class="container">

      <h1>🎤 ZEG EENS EUH</h1>

      <div class="card center">

        <h2>Spelcode</h2>

        <div class="code">${code}</div>

        <p class="small">
          Laat de spelers deze QR-code scannen.
        </p>

        <div id="qr" class="qr"></div>

      </div>


      <div class="card">

        <h2>Onderwerp</h2>

        <input
          id="topicInput"
          placeholder="Bijvoorbeeld: noem zoveel mogelijk dieren"
        >

        <button
          class="green bigButton"
          onclick="startGame()"
        >
          START 60 SECONDEN
        </button>

      </div>


      <div class="card">

        <div id="hostTopic" class="topic">
          Wacht op een onderwerp
        </div>

        <div id="hostTimer" class="timer">
          01:00
        </div>

        <div id="winnerBox" class="winner hidden">

          <div>🚨 EERST GEBUZZERD 🚨</div>

          <div id="winnerName" class="winnerName"></div>

          <p>
            De timer staat stil.
          </p>

          <button
            class="yellow bigButton"
            onclick="restartGame()"
          >
            HERSTART 60 SECONDEN
          </button>

        </div>

      </div>


      <div class="card">

        <h2>Spelers (<span id="playerCount">0</span>)</h2>

        <div id="players" class="players"></div>

      </div>

    </div>
  `;


  const playerUrl =
    window.location.href.split("?")[0] +
    "?player&game=" + code;

  new QRCode(
    document.getElementById("qr"),
    {
      text: playerUrl,
      width: 260,
      height: 260
    }
  );


  listenToGame(code);
}


let currentGame = null;
let timerInterval = null;


function listenToGame(code) {

  db.ref("games/" + code).on("value", snapshot => {

    currentGame = snapshot.val();

    if (!currentGame) return;

    document.getElementById("hostTopic").textContent =
      currentGame.topic || "Wacht op een onderwerp";


    const players = currentGame.players || {};

    document.getElementById("playerCount").textContent =
      Object.keys(players).length;


    document.getElementById("players").innerHTML =
      Object.values(players)
      .map(p => `<div class="player">${escapeHTML(p.name)}</div>`)
      .join("");


    const winnerBox = document.getElementById("winnerBox");

    if (currentGame.buzzer) {

      winnerBox.classList.remove("hidden");

      document.getElementById("winnerName").textContent =
        currentGame.buzzer.name;

    } else {

      winnerBox.classList.add("hidden");

    }


    updateHostTimer();

  });

}


function updateHostTimer() {

  if (timerInterval) {
    clearInterval(timerInterval);
  }

  timerInterval = setInterval(() => {

    if (!currentGame) return;

    if (!currentGame.running) {

      document.getElementById("hostTimer").textContent =
        "01:00";

      return;

    }

    const remaining =
      Math.max(
        0,
        currentGame.endAt - Date.now()
      );


    const seconds =
      Math.ceil(remaining / 1000);


    const minutes =
      Math.floor(seconds / 60);

    const secs =
      seconds % 60;


    document.getElementById("hostTimer").textContent =
      String(minutes).padStart(2,"0") +
      ":" +
      String(secs).padStart(2,"0");


    if (remaining <= 0) {

      db.ref("games/" + localStorage.getItem("zegEensEuhGame"))
        .update({
          running: false,
          endAt: 0
        });

    }

  }, 100);

}


function startGame() {

  const topic =
    document.getElementById("topicInput").value.trim();

  if (!topic) {

    alert("Vul eerst een onderwerp in.");

    return;
  }


  const code =
    localStorage.getItem("zegEensEuhGame");


  db.ref("games/" + code).update({

    topic: topic,

    running: true,

    endAt: Date.now() + 60000,

    buzzer: null

  });

}


function restartGame() {

  const code =
    localStorage.getItem("zegEensEuhGame");


  db.ref("games/" + code).update({

    running: true,

    endAt: Date.now() + 60000,

    buzzer: null

  });

}


/* =========================
   PLAYER
========================= */

if (mode === "player") {

  showPlayer(gameCode);

}


function showPlayer(code) {

  document.body.innerHTML = `

    <div class="playerPage">

      <div class="playerBox">

        <h1>🎤 ZEG EENS EUH</h1>

        <div id="login">

          <h2>Wie ben jij?</h2>

          <input
            id="nameInput"
            maxlength="25"
            placeholder="Jouw naam"
          >

          <button
            class="white bigButton"
            onclick="joinGame()"
          >
            MEESPELEN
          </button>

        </div>


        <div id="playerGame" class="hidden">

          <h2 id="hello"></h2>

          <p id="playerStatus">
            Wacht op de start...
          </p>

          <button
            id="buzzButton"
            class="buzz"
            onclick="buzz()"
            disabled
          >
            BUZZ!
          </button>

        </div>

      </div>

    </div>
  `;

}


let playerId =
  localStorage.getItem("zegEensEuhPlayerId");

if (!playerId) {

  playerId =
    crypto.randomUUID();

  localStorage.setItem(
    "zegEensEuhPlayerId",
    playerId
  );

}


function joinGame() {

  const name =
    document.getElementById("nameInput")
      .value
      .trim();


  if (!name) {

    alert("Vul je naam in.");

    return;
  }


  if (!gameCode) {

    alert("Geen spel gevonden.");

    return;
  }


  db.ref(
    "games/" +
    gameCode +
    "/players/" +
    playerId
  ).set({

    name: name

  });


  document.getElementById("login")
    .classList.add("hidden");


  document.getElementById("playerGame")
    .classList.remove("hidden");


  document.getElementById("hello")
    .textContent =
    "Hallo " + name + " 👋";


  listenToPlayer();

}


function listenToPlayer() {

  db.ref("games/" + gameCode).on(
    "value",
    snapshot => {

      const game =
        snapshot.val();


      if (!game) return;


      const button =
        document.getElementById("buzzButton");


      const status =
        document.getElementById("playerStatus");


      if (game.buzzer) {

        button.disabled = true;


        if (
          game.buzzer.id === playerId
        ) {

          status.textContent =
            "🚨 JIJ WAS EERST!";

        } else {

          status.textContent =
            "Te laat! " +
            game.buzzer.name +
            " was eerst.";

        }

        return;
      }


      if (game.running) {

        button.disabled = false;

        status.textContent =
          "DRUK BIJ EUH OF EEN VERBODEN WOORD!";

      } else {

        button.disabled = true;

        status.textContent =
          "Wacht op de start...";

      }

    }
  );

}


function buzz() {

  if (!gameCode) return;


  const gameRef =
    db.ref("games/" + gameCode);


  /*
     TRANSACTION = BELANGRIJK!

     Firebase zorgt hiermee dat wanneer
     meerdere spelers tegelijk drukken,
     slechts één speler de buzzer krijgt.
  */

  gameRef.transaction(game => {

    if (!game) return game;


    if (!game.running) {
      return;
    }


    if (game.buzzer) {
      return;
    }


    const me =
      game.players &&
      game.players[playerId];


    if (!me) {
      return;
    }


    game.buzzer = {

      id: playerId,

      name: me.name,

      time: Date.now()

    };


    game.running = false;

    game.endAt = 0;


    return game;

  });

}


/* =========================
   TV / LAPTOP SCHERM
========================= */

if (mode === "screen") {

  showScreen(gameCode);

}


function showScreen(code) {

  document.body.innerHTML = `

    <div class="container">

      <h1>🎤 ZEG EENS EUH</h1>

      <div class="card center">

        <div
          id="screenTopic"
          class="topic"
        >
          Wacht op onderwerp...
        </div>


        <div
          id="screenTimer"
          class="timer"
        >
          01:00
        </div>


        <div
          id="screenWinner"
          class="winner hidden"
        >

          <div>🚨 GEBUZZERD! 🚨</div>

          <div
            id="screenWinnerName"
            class="winnerName"
          ></div>

          <h2>
            De timer staat stil
          </h2>

        </div>

      </div>


      <div class="card center">

        <h2>Spelers</h2>

        <div
          id="screenPlayers"
          class="players"
          style="justify-content:center"
        ></div>

      </div>

    </div>
  `;


  listenToScreen(code);

}


function listenToScreen(code) {

  let screenGame = null;


  db.ref("games/" + code).on(
    "value",
    snapshot => {

      screenGame =
        snapshot.val();


      if (!screenGame) return;


      document.getElementById(
        "screenTopic"
      ).textContent =
        screenGame.topic ||
        "Wacht op onderwerp...";


      const players =
        screenGame.players || {};


      document.getElementById(
        "screenPlayers"
      ).innerHTML =
        Object.values(players)
        .map(p =>
          `<div class="player">
             ${escapeHTML(p.name)}
           </div>`
        )
        .join("");


      const winner =
        document.getElementById(
          "screenWinner"
        );


      if (screenGame.buzzer) {

        winner.classList.remove("hidden");

        document.getElementById(
          "screenWinnerName"
        ).textContent =
          screenGame.buzzer.name;

      } else {

        winner.classList.add("hidden");

      }


      function update() {

        if (!screenGame.running) {

          document.getElementById(
            "screenTimer"
          ).textContent =
            screenGame.buzzer
              ? "STOP"
              : "01:00";

          return;

        }


        const remaining =
          Math.max(
            0,
            screenGame.endAt -
            Date.now()
          );


        const seconds =
          Math.ceil(
            remaining / 1000
          );


        const minutes =
          Math.floor(seconds / 60);


        const secs =
          seconds % 60;


        document.getElementById(
          "screenTimer"
        ).textContent =
          String(minutes).padStart(2,"0") +
          ":" +
          String(secs).padStart(2,"0");

      }


      update();


      if (window.screenTimerInterval) {
        clearInterval(
          window.screenTimerInterval
        );
      }


      window.screenTimerInterval =
        setInterval(update,100);

    }
  );

}

</script>

</body>
</html>
